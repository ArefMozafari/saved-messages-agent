[project]
name = "saved-messages-agent"
version = "0.1.0"
description = "Telegram Saved Messages → AI Categorizer → Notion Agent"
requires-python = ">=3.11"
dependencies = [
    "pyrogram>=2.0.106",
    "tgcrypto>=1.2.5",
    "google-genai>=1.0.0",
    "notion-client>=2.2.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"

